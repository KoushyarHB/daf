# Create or update a super_admin on Neon when your PC cannot reach port 5432.
# Same pattern as seed-production-db.yml — GitHub Actions runners can connect.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL                  Neon pooled URL (same as Vercel)
#   DIRECT_URL                    Neon direct URL (same as Vercel)
#   SUPER_ADMIN_BOOTSTRAP_PASSWORD  Initial login password (not stored in git)
#
# Run: Actions → "Bootstrap super admin" → Run workflow
# CI: use `npx tsx scripts/...` (not npm run) — .env is gitignored; secrets are injected as env vars.

name: Bootstrap super admin

on:
  workflow_dispatch:
    inputs:
      email:
        description: Super admin email
        required: true
        default: koushyar.heidari@gmail.com
      name:
        description: Display name
        required: true
        default: Koushyar Heidari Bateni

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Create or update super admin
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPER_ADMIN_EMAIL: ${{ github.event.inputs.email }}
          SUPER_ADMIN_NAME: ${{ github.event.inputs.name }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_BOOTSTRAP_PASSWORD }}
        run: npx tsx scripts/create-super-admin.ts
